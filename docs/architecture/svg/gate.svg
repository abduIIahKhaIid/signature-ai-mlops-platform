<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" role="img" aria-label="Validation gate: three checks on the held-out test set decide whether the new model is deployed" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="validationgateth-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#B42318"/></marker><marker id="validationgateth-arrow-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#B42318"/></marker><marker id="validationgateth-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#15803D"/></marker><marker id="validationgateth-arrow-good-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#15803D"/></marker><marker id="validationgateth-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#17202E"/></marker><marker id="validationgateth-arrow-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#17202E"/></marker><marker id="validationgateth-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#B45309"/></marker><marker id="validationgateth-arrow-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#B45309"/></marker></defs><rect width="1240" height="380" style="fill:#FFFFFF"/><rect x="20" y="140" width="200" height="90" rx="8" style="fill:#E3F4F1;stroke:#0F766E;stroke-width:1.2"/><text x="32" y="161" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">New model (challenger)</text><text x="32" y="179" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">best checkpoint by</text><text x="32" y="194" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">validation mAP@50</text><rect x="300" y="40" width="300" height="86" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="312" y="61" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Quality floor</text><text x="312" y="79" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">test mAP@50 ≥ 0.75</text><text x="312" y="94" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">GATE_MIN_TEST_MAP50</text><path d="M 220 185 L 260 185 L 260 83 L 300 83" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#validationgateth-arrow-ink)"/><path d="M 600 83 L 650 83 L 650 185 L 690 185" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#validationgateth-arrow-ink)"/><rect x="300" y="150" width="300" height="86" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="312" y="171" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">No regression</text><text x="312" y="189" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">test mAP@50 ≥ served − 0.02</text><text x="312" y="204" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">both scored on this run&#x27;s test set</text><path d="M 220 185 L 260 185 L 260 193 L 300 193" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#validationgateth-arrow-ink)"/><path d="M 600 193 L 650 193 L 650 185 L 690 185" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#validationgateth-arrow-ink)"/><rect x="300" y="260" width="300" height="86" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="312" y="281" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">No overfitting</text><text x="312" y="299" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">val mAP@50 − test mAP@50 ≤ 0.05</text><text x="312" y="314" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">GATE_MAX_VAL_TEST_GAP</text><path d="M 220 185 L 260 185 L 260 303 L 300 303" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#validationgateth-arrow-ink)"/><path d="M 600 303 L 650 303 L 650 185 L 690 185" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#validationgateth-arrow-ink)"/><rect x="690" y="150" width="140" height="70" rx="8" style="fill:#FFFFFF;stroke:#17202E;stroke-width:1.2"/><text x="760" y="180" text-anchor="middle" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:12.5px;font-weight:600;fill:#17202E">all three pass?</text><text x="760" y="198" text-anchor="middle" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11px;font-weight:400;fill:#566175">(all reasons listed)</text><rect x="920" y="40" width="300" height="90" rx="8" style="fill:#FFFFFF;stroke:#15803D;stroke-width:1.2"/><text x="932" y="61" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#15803D">deployed</text><text x="932" y="79" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">AUTO_DEPLOY on: alias → new version</text><text x="932" y="94" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">workers hot-reload within 300 s</text><rect x="920" y="150" width="300" height="70" rx="8" style="fill:#FFFFFF;stroke:#B45309;stroke-width:1.2"/><text x="932" y="171" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#B45309">approved, not deployed</text><text x="932" y="189" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">AUTO_DEPLOY off: alias unchanged</text><rect x="920" y="250" width="300" height="90" rx="8" style="fill:#FFFFFF;stroke:#B42318;stroke-width:1.2"/><text x="932" y="271" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#B42318">rejected</text><text x="932" y="289" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">served model keeps serving</text><text x="932" y="304" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">version + Comet run kept for review</text><path d="M 830 175 L 875 175 L 875 85 L 920 85" style="fill:none;stroke:#15803D;stroke-width:1.5" marker-end="url(#validationgateth-arrow-good)"/><rect x="877.8" y="110.0" width="24.5" height="15" rx="3" style="fill:#FFFFFF;opacity:0.92"/><text x="890" y="120" text-anchor="middle" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11px;font-weight:400;fill:#15803D">yes</text><path d="M 830 185 L 920 185" style="fill:none;stroke:#B45309;stroke-width:1.5" marker-end="url(#validationgateth-arrow-warn)"/><path d="M 830 200 L 875 200 L 875 295 L 920 295" style="fill:none;stroke:#B42318;stroke-width:1.5" marker-end="url(#validationgateth-arrow-bad)"/><rect x="880.8" y="245.0" width="18.3" height="15" rx="3" style="fill:#FFFFFF;opacity:0.92"/><text x="890" y="255" text-anchor="middle" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11px;font-weight:400;fill:#B42318">no</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>