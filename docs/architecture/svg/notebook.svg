<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" role="img" aria-label="Training notebook on Kaggle: from the pinned dataset ZIP to an uploaded, gated model version" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="trainingnotebook-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#17202E"/></marker><marker id="trainingnotebook-arrow-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:#17202E"/></marker></defs><rect width="1240" height="360" style="fill:#FFFFFF"/><rect x="20" y="50" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="32" y="71" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Download ZIP</text><text x="32" y="89" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">pinned HF commit</text><text x="32" y="104" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">SHA-256 verified</text><rect x="224" y="50" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="236" y="71" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Read annotations</text><text x="236" y="89" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">YOLO or COCO</text><text x="236" y="104" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">to one COCO set</text><path d="M 200 90 L 224 90" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="428" y="50" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="440" y="71" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Clean</text><text x="440" y="89" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">invalid images</text><text x="440" y="104" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">bad boxes · exact dups</text><path d="M 404 90 L 428 90" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="632" y="50" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="644" y="71" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Near-duplicates</text><text x="644" y="89" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">pHash + SSIM</text><text x="644" y="104" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">confirmed pairs</text><path d="M 608 90 L 632 90" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="836" y="50" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="848" y="71" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Split + leakage gate</text><text x="848" y="89" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">train / val / test</text><text x="848" y="104" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">no image in two splits</text><path d="M 812 90 L 836 90" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="1040" y="50" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="1052" y="71" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Warm start</text><text x="1052" y="89" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">served model from</text><text x="1052" y="104" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">S3 alias latest</text><path d="M 1016 90 L 1040 90" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="20" y="200" width="180" height="80" rx="8" style="fill:#E3F4F1;stroke:#0F766E;stroke-width:1.2"/><text x="32" y="221" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Fine-tune RT-DETRv2</text><text x="32" y="239" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">epochs from dashboard</text><text x="32" y="254" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">early stopping on val</text><rect x="224" y="200" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="236" y="221" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Test evaluation</text><text x="236" y="239" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">held-out test set</text><text x="236" y="254" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">mAP@50, mAP@50:95</text><path d="M 200 240 L 224 240" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="428" y="200" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="440" y="221" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Calibrate threshold</text><text x="440" y="239" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">on validation set</text><text x="440" y="254" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">precision / recall</text><path d="M 404 240 L 428 240" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="632" y="200" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="644" y="221" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Package</text><text x="644" y="239" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">artifact.zip +</text><text x="644" y="254" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">manifest.json</text><path d="M 608 240 L 632 240" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="836" y="200" width="180" height="80" rx="8" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="848" y="221" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Upload version</text><text x="848" y="239" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">versions/&lt;v&gt;/ in S3</text><text x="848" y="254" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">checkpoints too</text><path d="M 812 240 L 836 240" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="1040" y="200" width="180" height="80" rx="8" style="fill:#E3F4F1;stroke:#0F766E;stroke-width:1.2"/><text x="1052" y="221" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:13px;font-weight:600;fill:#17202E">Validation gate</text><text x="1052" y="239" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">deploy or reject</text><text x="1052" y="254" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">(see the gate figure)</text><path d="M 1016 240 L 1040 240" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><path d="M 1130.0 130 L 1130.0 165 L 110 165 L 110 200" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#trainingnotebook-arrow-ink)"/><rect x="566.2" y="150.0" width="67.6" height="15" rx="3" style="fill:#FFFFFF;opacity:0.92"/><text x="600" y="160" text-anchor="middle" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11px;font-weight:400;fill:#566175">then train</text><text x="20" y="320" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">Every phase writes its status to pipeline_runs/live/&lt;run&gt;.json (dashboard) and its metrics and reports to Comet.</text><text x="20" y="338" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">Smoke mode trains on up to 2,000 / 500 train / val images; full mode on the whole dataset.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>