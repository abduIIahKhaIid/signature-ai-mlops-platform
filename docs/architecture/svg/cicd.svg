nk)"/><rect x="745" y="248" width="455" height="42" rx="6" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="759" y="266" text-anchor="start" style="font-family:'IBM Plex Mono', Consolas, monospace;font-size:12.5px;font-weight:600;fill:#17202E">3  build api → worker → pipeline</text><text x="759" y="282" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11px;font-weight:400;fill:#566175">one image at a time (torch is heavy)</text><path d="M 972 238 L 972 248" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#cicdtestsandimag-arrow-ink)"/><rect x="745" y="300" width="455" height="42" rx="6" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="759" y="318" text-anchor="start" style="font-family:'IBM Plex Mono', Consolas, monospace;font-size:12.5px;font-weight:600;fill:#17202E">4  docker compose up -d</text><text x="759" y="334" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11px;font-weight:400;fill:#566175">+ caddy if PUBLIC_HOST is set</text><path d="M 972 290 L 972 300" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#cicdtestsandimag-arrow-ink)"/><rect x="745" y="352" width="455" height="42" rx="6" style="fill:#FFFFFF;stroke:#C9D0DB;stroke-width:1.2"/><text x="759" y="370" text-anchor="start" style="font-family:'IBM Plex Mono', Consolas, monospace;font-size:12.5px;font-weight:600;fill:#17202E">wait for /ready, /health = &lt;sha&gt;</text><text x="759" y="386" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11px;font-weight:400;fill:#566175">fail the deploy after 5 min</text><path d="M 972 342 L 972 352" style="fill:none;stroke:#17202E;stroke-width:1.5" marker-end="url(#cicdtestsandimag-arrow-ink)"/><text x="745" y="420" text-anchor="start" style="font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#566175">then GitHub checks the public URL: /health and /ready</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>